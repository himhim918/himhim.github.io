<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>MediaPipe Face Texture Mesh</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
}

#ui {
    position: absolute;
    top: 10px;
    left: 10px;
    z-index: 999;
    background: rgba(0,0,0,.8);
    padding: 12px;
    border-radius: 12px;
    color: white;
    font-family: Arial;
}

#video{
    width:280px;
    display:block;
    border-radius:10px;
    transform:scaleX(-1);
}

button{
    width:280px;
    height:42px;
    margin-top:10px;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>

<script type="importmap">
{
    "imports": {
        "three":"https://unpkg.com/three@0.170.0/build/three.module.js",
        "three/addons/":"https://unpkg.com/three@0.170.0/examples/jsm/"
    }
}
</script>

</head>
<body>

<div id="ui">

    <video
        id="video"
        autoplay
        playsinline
        muted>
    </video>

   <button id="captureBtn">
    Generate Face Texture
</button>

<button onclick="setExpression('normal')">
🙂 Normal
</button>

<button onclick="setExpression('angry')">
😠 Angry
</button>

    <div id="status">
        Loading...
    </div>

</div>

<canvas
    id="captureCanvas"
    style="display:none">
</canvas>

<script type="module">

import * as THREE from "three";

import {
    OrbitControls
}
from "three/addons/controls/OrbitControls.js";

import {
    FaceLandmarker,
    FilesetResolver
}
from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const video =
    document.getElementById("video");

const captureBtn =
    document.getElementById("captureBtn");

const statusEl =
    document.getElementById("status");

const captureCanvas =
    document.getElementById("captureCanvas");

const captureCtx =
    captureCanvas.getContext("2d");

let faceMesh = null;
let originalPositions = null;

/* ---------------------- */
/* THREE */
/* ---------------------- */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(0x1a1a1a);

const camera =
    new THREE.PerspectiveCamera(
        35,
        window.innerWidth / window.innerHeight,
        0.01,
        100
    );

camera.position.z = 2.5;

const renderer =
    new THREE.WebGLRenderer({
        antialias:true
    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

document.body.appendChild(
    renderer.domElement
);

const controls =
    new OrbitControls(
        camera,
        renderer.domElement
    );

scene.add(
    new THREE.AmbientLight(
        0xffffff,
        2
    )
);

const dl =
    new THREE.DirectionalLight(
        0xffffff,
        2
    );

dl.position.set(
    2,
    2,
    2
);

scene.add(dl);

/* ---------------------- */
/* CAMERA */
/* ---------------------- */

const stream =
    await navigator.mediaDevices.getUserMedia({

        video:{
            facingMode:"user",
            width:1280,
            height:720
        }

    });

video.srcObject =
    stream;

/* ---------------------- */
/* MEDIAPIPE */
/* ---------------------- */

statusEl.innerText =
    "Loading MediaPipe...";

const vision =
    await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
    );

const faceLandmarker =
    await FaceLandmarker.createFromOptions(
        vision,
        {
            baseOptions:{
                modelAssetPath:
                "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task"
            },
            runningMode:"IMAGE",
            numFaces:1
        }
    );

statusEl.innerText =
    "Ready";

/* ---------------------- */
/* TRIANGLE BUILDER */
/* ---------------------- */
window.setExpression =
function(type){

    if(!faceMesh)
        return;

    const pos =
        faceMesh.geometry.attributes.position;

    if(type === "normal"){

        pos.array.set(
            originalPositions
        );

        pos.needsUpdate = true;

        return;
    }

    pos.array.set(
        originalPositions
    );

    if(type === "angry"){

        // left eyebrow
        pos.setY(70, pos.getY(70) - 0.25);
        pos.setY(63, pos.getY(63) - 0.20);

        // right eyebrow
        pos.setY(300, pos.getY(300) - 0.25);
        pos.setY(293, pos.getY(293) - 0.20);

        // eyes squint
        pos.setY(159, pos.getY(159) + 0.10);
        pos.setY(145, pos.getY(145) - 0.10);

        pos.setY(386, pos.getY(386) + 0.10);
        pos.setY(374, pos.getY(374) - 0.10);

        // mouth corners down
        pos.setY(61, pos.getY(61) + 0.15);
        pos.setY(291, pos.getY(291) + 0.15);

        // chin forward
        pos.setY(152, pos.getY(152) + 0.10);
    }

    pos.needsUpdate = true;
};

    
function buildTriangles(edges){

    const adj =
        new Map();

    for(const [a,b] of edges){

        if(!adj.has(a))
            adj.set(a,new Set());

        if(!adj.has(b))
            adj.set(b,new Set());

        adj.get(a).add(b);
        adj.get(b).add(a);
    }

    const triangles = [];

    for(const [a,b] of edges){

        const na =
            adj.get(a);

        const nb =
            adj.get(b);

        for(const c of na){

            if(
                nb.has(c) &&
                a < b &&
                b < c
            ){
                triangles.push(
                    a,
                    b,
                    c
                );
            }
        }
    }

    return triangles;
}

/* ---------------------- */
/* CAPTURE */
/* ---------------------- */

captureBtn.onclick =
async ()=>{

    captureCanvas.width =
        video.videoWidth;

    captureCanvas.height =
        video.videoHeight;

    captureCtx.drawImage(
        video,
        0,
        0
    );

    const result =
        await faceLandmarker.detect(
            captureCanvas
        );

    if(
        !result.faceLandmarks ||
        result.faceLandmarks.length===0
    ){
        alert("No face detected");
        return;
    }

    const landmarks =
        result.faceLandmarks[0];

    const positions = [];
    const uvs = [];

    for(const p of landmarks){

        positions.push(
            (p.x - 0.5) * 2,
            -(p.y - 0.5) * 2,
            p.z * 2
        );

        uvs.push(
            p.x,
            1.0 - p.y
        );
    }

    const indices =
        buildTriangles(
            FACEMESH_TESSELATION
        );

    console.log(
        "triangles:",
        indices.length / 3
    );

    const geometry =
        new THREE.BufferGeometry();

    geometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(
            positions,
            3
        )
    );

    geometry.setAttribute(
        "uv",
        new THREE.Float32BufferAttribute(
            uvs,
            2
        )
    );

    geometry.setIndex(
        indices
    );

    geometry.computeVertexNormals();

    const texture =
        new THREE.CanvasTexture(
            captureCanvas
        );

    texture.center.set(0.5, 0.5);
texture.rotation = Math.PI;
    texture.flipY = false;
    texture.needsUpdate = true;

    const material =
        new THREE.MeshBasicMaterial({
            map:texture,
            side:THREE.DoubleSide
        });

    if(faceMesh){

        scene.remove(
            faceMesh
        );

        faceMesh.geometry.dispose();

        faceMesh.material.dispose();
    }

    faceMesh =
        new THREE.Mesh(
            geometry,
            material
        );
    originalPositions =
    new Float32Array(
        geometry.attributes.position.array
    );

    scene.add(
        faceMesh
    );

    statusEl.innerText =
        "Texture Face Generated";
};

/* ---------------------- */
/* RENDER */
/* ---------------------- */

function animate(){

    requestAnimationFrame(
        animate
    );

    controls.update();

    renderer.render(
        scene,
        camera
    );
}

animate();

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);

</script>

</body>
</html>
