<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FaceCap User Head Spawn</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
}

#ui{
    position:absolute;
    top:10px;
    left:10px;
    z-index:1000;
    background:rgba(0,0,0,.8);
    color:white;
    padding:12px;
    border-radius:12px;
}

#video{
    width:280px;
    display:block;
    transform:scaleX(-1);
    border-radius:8px;
}

button{
    width:280px;
    height:40px;
    margin-top:8px;
}

#status{
    margin-top:8px;
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
  }
}
</script>

</head>
<body>

<div id="ui">

<video
id="video"
autoplay
muted
playsinline
></video>

<button id="captureBtn">
Take Selfie Head
</button>

<div id="status">
Loading...
</div>

</div>

<canvas id="captureCanvas" style="display:none"></canvas>

<script type="module">

import * as THREE from "three";

import {
OrbitControls
} from "three/addons/controls/OrbitControls.js";

import {
GLTFLoader
} from "three/addons/loaders/GLTFLoader.js";

import {
KTX2Loader
} from "three/addons/loaders/KTX2Loader.js";

import {
MeshoptDecoder
} from "three/addons/libs/meshopt_decoder.module.js";
    
import {
FaceLandmarker,
FilesetResolver
}
from
"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const video =
document.getElementById("video");

const captureBtn =
document.getElementById("captureBtn");

const statusEl =
document.getElementById("status");

const captureCanvas =
document.getElementById("captureCanvas");

const captureCtx =
captureCanvas.getContext("2d");

let faceMesh = null;
let selfieHead = null;

const scene =
new THREE.Scene();

scene.background =
new THREE.Color(0x222222);

const camera =
new THREE.PerspectiveCamera(
35,
window.innerWidth/window.innerHeight,
0.01,
100
);

camera.position.set(
0,
0.2,
2.5
);

const renderer =
new THREE.WebGLRenderer({
antialias:true
});

renderer.setSize(
window.innerWidth,
window.innerHeight
);

document.body.appendChild(
renderer.domElement
);

const controls =
new OrbitControls(
camera,
renderer.domElement
);

controls.enableDamping = true;

scene.add(
new THREE.HemisphereLight(
0xffffff,
0x777777,
2
)
);

const dirLight =
new THREE.DirectionalLight(
0xffffff,
2
);

dirLight.position.set(
2,
2,
3
);

scene.add(
dirLight
);

const loader =
new GLTFLoader();

statusEl.innerText =
"loading facecap...";

loader.load(
"./facecap.glb",

(gltf)=>{

scene.add(
gltf.scene
);

gltf.scene.scale.set(
1,
1,
1
);

gltf.scene.traverse((obj)=>{

if(!obj.isMesh) return;

if(
obj.geometry.attributes.position &&
obj.geometry.attributes.position.count === 2694
){
    faceMesh = obj;

    console.log(
    "facemesh found",
    obj
    );
}

});

statusEl.innerText =
"FaceCap Ready";

}
);

const vision =
await FilesetResolver.forVisionTasks(
"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
);

const faceLandmarker =
await FaceLandmarker.createFromOptions(
vision,
{
baseOptions:{
modelAssetPath:
"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task"
},
outputFaceBlendshapes:true,
outputFacialTransformationMatrixes:true,
numFaces:1
}
);

const stream =
await navigator.mediaDevices.getUserMedia(
{
video:{
facingMode:"user",
width:1280,
height:720
}
}
);

video.srcObject = stream;

statusEl.innerText =
"Camera Ready";

captureBtn.onclick =
async ()=>{

captureCanvas.width =
video.videoWidth;

captureCanvas.height =
video.videoHeight;

captureCtx.drawImage(
video,
0,
0
);

const result =
faceLandmarker.detect(
captureCanvas
);

if(
!result.faceLandmarks ||
result.faceLandmarks.length === 0
){
alert(
"No face detected"
);
return;
}

const landmarks =
result.faceLandmarks[0];

let minX=999;
let minY=999;
let maxX=0;
let maxY=0;

for(const p of landmarks){

minX =
Math.min(minX,p.x);

minY =
Math.min(minY,p.y);

maxX =
Math.max(maxX,p.x);

maxY =
Math.max(maxY,p.y);

}

const sx =
minX * captureCanvas.width;

const sy =
minY * captureCanvas.height;

const sw =
(maxX-minX) * captureCanvas.width;

const sh =
(maxY-minY) * captureCanvas.height;

const faceCanvas =
document.createElement("canvas");

faceCanvas.width = 1024;
faceCanvas.height = 1024;

const faceCtx =
faceCanvas.getContext("2d");

faceCtx.fillStyle =
"#808080";

faceCtx.fillRect(
0,
0,
1024,
1024
);

faceCtx.drawImage(
captureCanvas,
sx,
sy,
sw,
sh,
0,
0,
1024,
1024
);

const texture =
new THREE.CanvasTexture(
faceCanvas
);

texture.needsUpdate = true;

if(selfieHead){

selfieHead.parent?.remove(
selfieHead
);

}

const plane =
new THREE.Mesh(

new THREE.PlaneGeometry(
0.55,
0.70
),

new THREE.MeshBasicMaterial({
map:texture,
transparent:true
})

);

selfieHead = plane;

if(faceMesh){

faceMesh.add(
plane
);

plane.position.set(
0,
0.02,
0.08
);

}else{

scene.add(
plane
);

plane.position.set(
0,
0,
0
);

}

statusEl.innerText =
"Selfie Head Spawned";

};

function animate(){

requestAnimationFrame(
animate
);

controls.update();

renderer.render(
scene,
camera
);

}

animate();

window.addEventListener(
"resize",
()=>{

camera.aspect =
window.innerWidth/
window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight
);

}
);

</script>

</body>
</html>
