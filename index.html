<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>

<title>MediaPipe FaceMesh ThreeJS</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
}

#ui{
    position:absolute;
    top:10px;
    left:10px;
    z-index:999;
    background:rgba(0,0,0,.8);
    padding:12px;
    border-radius:12px;
    color:white;
    font-family:Arial;
}

#video{
    width:280px;
    display:block;
    border-radius:10px;
    transform:scaleX(-1);
}

button{
    width:280px;
    height:42px;
    margin-top:10px;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>

  }
}
</script>
</head>
