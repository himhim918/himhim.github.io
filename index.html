<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>

<title>MediaPipe FaceMesh ThreeJS</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
}

#ui{
    position:absolute;
    top:10px;
    left:10px;
    z-index:999;
    background:rgba(0,0,0,.8);
    padding:12px;
    border-radius:12px;
    color:white;
    font-family:Arial;
}

#video{
    width:280px;
    display:block;
    border-radius:10px;
    transform:scaleX(-1);
}

button{
    width:280px;
    height:42px;
    margin-top:10px;
}
</style>

https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.jsscript>

<script type="importmap">
{
  "imports": {
    "three":"https://unpkg.com/three@0.170.0/build/three.module.js",
    "three/addons/":"https://unpkg.com/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>

<body>

<div id="ui">

<video
id="video"
autoplay
playsinline
muted>
</video>

<button id="captureBtn">
Generate Face Mesh
</button>

<div id="status">
Ready
</div>

</div>

<canvas
id="captureCanvas"
style="display:none">
</canvas>

<script type="module">

import * as THREE from "three";

import {
OrbitControls
}
from "three/addons/controls/OrbitControls.js";

import {
FaceLandmarker,
FilesetResolver
}
from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const video =
document.getElementById("video");

const captureBtn =
document.getElementById("captureBtn");

const statusEl =
document.getElementById("status");

const captureCanvas =
document.getElementById("captureCanvas");

const captureCtx =
captureCanvas.getContext("2d");

let faceWireframe = null;

/* ThreeJS */

const scene =
new THREE.Scene();

scene.background =
new THREE.Color(0x1a1a1a);

const camera =
new THREE.PerspectiveCamera(
35,
window.innerWidth/window.innerHeight,
0.01,
100
);

camera.position.z =
2.5;

const renderer =
new THREE.WebGLRenderer({
antialias:true
});

renderer.setSize(
window.innerWidth,
window.innerHeight
);

document.body.appendChild(
renderer.domElement
);

const controls =
new OrbitControls(
camera,
renderer.domElement
);

scene.add(
new THREE.AmbientLight(
0xffffff,
2
)
);

const dl =
new THREE.DirectionalLight(
0xffffff,
2
);

dl.position.set(
2,
2,
2
);

scene.add(dl);

/* Camera */

const stream =
await navigator.mediaDevices.getUserMedia({

video:{
facingMode:"user",
width:1280,
height:720
}

});

video.srcObject =
stream;

/* MediaPipe */

statusEl.innerText =
"Loading MediaPipe";

const vision =
await FilesetResolver.forVisionTasks(

"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"

);

const faceLandmarker =
await FaceLandmarker.createFromOptions(
vision,
{
baseOptions:{
modelAssetPath:
"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task"
},
runningMode:"IMAGE",
numFaces:1
}
);

statusEl.innerText =
"Ready";

/* Capture */

captureBtn.onclick =
async ()=>{

captureCanvas.width =
video.videoWidth;

captureCanvas.height =
video.videoHeight;

captureCtx.drawImage(
video,
0,
0
);

const result =
await faceLandmarker.detect(
captureCanvas
);

if(
!result.faceLandmarks ||
result.faceLandmarks.length===0
){
alert(
"No face detected"
);
return;
}

const landmarks =
result.faceLandmarks[0];

console.log(
"landmarks",
landmarks.length
);

console.log(
"edges",
FACEMESH_TESSELATION.length
);

const vertices = [];

for(const edge of FACEMESH_TESSELATION){

const p1 =
landmarks[edge[0]];

const p2 =
landmarks[edge[1]];

vertices.push(
(p1.x-0.5)*2,
-(p1.y-0.5)*2,
p1.z*2
);

vertices.push(
(p2.x-0.5)*2,
-(p2.y-0.5)*2,
p2.z*2
);
}

const geometry =
new THREE.BufferGeometry();

geometry.setAttribute(
"position",
new THREE.Float32BufferAttribute(
vertices,
3
)
);

const material =
new THREE.LineBasicMaterial({
color:0x00ff88
});

if(faceWireframe){

scene.remove(
faceWireframe
);

faceWireframe.geometry.dispose();
faceWireframe.material.dispose();

}

faceWireframe =
new THREE.LineSegments(
geometry,
material
);

scene.add(
faceWireframe
);

statusEl.innerText =
"FaceMesh Generated";

};

/* Render */

function animate(){

requestAnimationFrame(
animate
);

controls.update();

renderer.render(
scene,
camera
);

}

animate();

window.addEventListener(
"resize",
()=>{

camera.aspect =
window.innerWidth /
window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight
);

}
);

</script>

</body>
</html>
