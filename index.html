<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>3D User Face Spawn</title>

<style>

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    font-family:Arial;
}

#ui{
    position:absolute;
    top:10px;
    left:10px;
    z-index:999;
    background:rgba(0,0,0,.8);
    padding:12px;
    border-radius:12px;
    color:white;
}

#video{
    width:280px;
    display:block;
    transform:scaleX(-1);
    border-radius:8px;
}

button{
    width:280px;
    height:42px;
    margin-top:8px;
}

#status{
    margin-top:8px;
}

</style>

<script type="importmap">
{
    "imports": {
        "three":"https://unpkg.com/three@0.170.0/build/three.module.js",
        "three/addons/":"https://unpkg.com/three@0.170.0/examples/jsm/"
    }
}
</script>
</head>

<body>

<div id="ui">

    <video
        id="video"
        autoplay
        playsinline
        muted>
    </video>

    <button id="captureBtn">
        Spawn 3D Face
    </button>

    <div id="status">
        Loading...
    </div>

</div>

<canvas
id="captureCanvas"
style="display:none">
</canvas>

<script type="module">

import * as THREE from "three";

import {
OrbitControls
}
from "three/addons/controls/OrbitControls.js";

import {
GLTFLoader
}
from "three/addons/loaders/GLTFLoader.js";

import {
KTX2Loader
}
from "three/addons/loaders/KTX2Loader.js";

import {
MeshoptDecoder
}
from "three/addons/libs/meshopt_decoder.module.js";

const video =
document.getElementById("video");

const captureBtn =
document.getElementById("captureBtn");

const captureCanvas =
document.getElementById("captureCanvas");

const captureCtx =
captureCanvas.getContext("2d");

const statusEl =
document.getElementById("status");

let headRoot = null;
let userFace = null;

const scene =
new THREE.Scene();

scene.background =
new THREE.Color(0x222222);

const camera =
new THREE.PerspectiveCamera(
35,
window.innerWidth/window.innerHeight,
0.01,
100
);

camera.position.set(
0,
0,
2.6
);

const renderer =
new THREE.WebGLRenderer({
antialias:true
});

renderer.setSize(
window.innerWidth,
window.innerHeight
);

document.body.appendChild(
renderer.domElement
);

const controls =
new OrbitControls(
camera,
renderer.domElement
);

controls.enableDamping = true;

scene.add(
new THREE.HemisphereLight(
0xffffff,
0x666666,
2
)
);

const dirLight =
new THREE.DirectionalLight(
0xffffff,
3
);

dirLight.position.set(
2,
2,
3
);

scene.add(
dirLight
);

const loader =
new GLTFLoader();

loader.setMeshoptDecoder(
MeshoptDecoder
);

const ktx2Loader =
new KTX2Loader();

ktx2Loader.setTranscoderPath(
"https://unpkg.com/three@0.170.0/examples/jsm/libs/basis/"
);

loader.setKTX2Loader(
ktx2Loader
);

statusEl.innerText =
"Loading facecap.glb";

loader.load(
"./facecap.glb",
(gltf)=>{

    headRoot =
    gltf.scene;

    scene.add(
        headRoot
    );

    statusEl.innerText =
    "Ready";
}
);

const stream =
await navigator.mediaDevices.getUserMedia({
video:{
    facingMode:"user",
    width:1280,
    height:720
}
});

video.srcObject = stream;

captureBtn.onclick = ()=>{

    captureCanvas.width =
    video.videoWidth;

    captureCanvas.height =
    video.videoHeight;

    captureCtx.drawImage(
        video,
        0,
        0
    );

    const texture =
    new THREE.CanvasTexture(
        captureCanvas
    );

    texture.needsUpdate = true;

    if(userFace){
        scene.remove(userFace);
    }

    const geometry =
    new THREE.SphereGeometry(
        0.33,
        160,
        160
    );

    const pos =
    geometry.attributes.position;

    for(let i=0;i<pos.count;i++){

        let x =
        pos.getX(i);

        let y =
        pos.getY(i);

        let z =
        pos.getZ(i);

        let scale = 1;

        if(z > 0){

            scale += z * 0.55;

            const nose =
            Math.exp(
                -(x*x*25)
            ) *
            Math.exp(
                -((y+0.03)*(y+0.03)*35)
            );

            scale += nose * 0.45;

            const cheek =
            (
                Math.exp(
                    -((x-0.15)*(x-0.15)*35)
                )
                +
                Math.exp(
                    -((x+0.15)*(x+0.15)*35)
                )
            );

            scale += cheek * 0.08;

        }

        pos.setXYZ(
            i,
            x*scale,
            y*scale,
            z*scale
        );
    }

    geometry.computeVertexNormals();

    const material =
    new THREE.MeshStandardMaterial({

        map:texture,

        roughness:0.9,

        metalness:0,

        side:THREE.DoubleSide

    });

    userFace =
    new THREE.Mesh(
        geometry,
        material
    );

    userFace.position.set(
        0,
        0,
        0.25
    );

    scene.add(
        userFace
    );

    statusEl.innerText =
    "3D Face Spawned";
};

function animate(){

    requestAnimationFrame(
        animate
    );

    controls.update();

    renderer.render(
        scene,
        camera
    );
}

animate();

window.addEventListener(
"resize",
()=>{

    camera.aspect =
    window.innerWidth /
    window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

}
);

</script>

</body>
</html>
